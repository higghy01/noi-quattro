# Dal 02/11/2026 gli avvisi partono da Firebase ogni 5 minuti (funzione notifiche5, workflow Funzioni).
# Questo resta solo per lanciarli a mano da GitHub, se Firebase avesse un problema.
name: Notifiche
on:
  workflow_dispatch: {}
concurrency: { group: notifiche, cancel-in-progress: false }
jobs:
  manda:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: scripts/requisiti.txt }
      - run: pip install -r scripts/requisiti.txt
      - run: python scripts/notifiche.py
        env:
          FIREBASE_CHIAVE: ${{ secrets.FIREBASE_CHIAVE }}
          URL_APP: ${{ vars.URL_APP }}
