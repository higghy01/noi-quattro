# Ogni 15 minuti controlla se c'è da mandare qualche notifica (promemoria, riepilogo, cena, novità).
name: Notifiche
on:
  schedule:
    - cron: "2,17,32,47 * * * *"
  workflow_dispatch: {}
concurrency: { group: notifiche, cancel-in-progress: false }
jobs:
  manda:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: scripts/requisiti.txt }
      - run: pip install -r scripts/requisiti.txt
      - run: python scripts/notifiche.py
        env:
          FIREBASE_CHIAVE: ${{ secrets.FIREBASE_CHIAVE }}
          URL_APP: ${{ vars.URL_APP }}
