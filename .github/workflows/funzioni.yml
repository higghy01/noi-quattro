# Pubblica su Firebase la funzione "notifiche5", che ogni 5 minuti manda gli avvisi (scelta di Sasha del 02/11/2026).
# Parte da sola quando cambia il programma delle notifiche; si può anche lanciare a mano.
name: Funzioni
on:
  push:
    branches: [main]
    paths: [functions/**, scripts/notifiche.py, scripts/comune.py, scripts/sincronizza_calendari.py, firebase.json]
  workflow_dispatch: {}
concurrency: { group: funzioni, cancel-in-progress: false }
jobs:
  pubblica:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      # Una sola fonte: i file del programma stanno in scripts/ e si copiano qui solo per pubblicarli.
      - run: cp scripts/notifiche.py scripts/comune.py scripts/sincronizza_calendari.py functions/
      - run: python -m venv functions/venv && functions/venv/bin/pip install -q -r functions/requirements.txt
      - name: Pubblica la funzione
        env:
          FIREBASE_CHIAVE: ${{ secrets.FIREBASE_CHIAVE }}
        run: |
          printf '%s' "$FIREBASE_CHIAVE" > "$RUNNER_TEMP/chiave.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/chiave.json"
          PROGETTO=$(python -c "import json,os; print(json.load(open(os.environ['GOOGLE_APPLICATION_CREDENTIALS']))['project_id'])")
          npx -y firebase-tools@14.27.0 deploy --only functions --project "$PROGETTO" --non-interactive --force
          rm -f "$RUNNER_TEMP/chiave.json"
