# Ogni 30 minuti copia nell'app i calendari collegati di ognuno.
name: Calendari
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch: {}
concurrency: { group: calendari, cancel-in-progress: false }
jobs:
  sincronizza:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: scripts/requisiti.txt }
      - run: pip install -r scripts/requisiti.txt
      - run: python scripts/sincronizza_calendari.py
        env:
          FIREBASE_CHIAVE: ${{ secrets.FIREBASE_CHIAVE }}
          CALENDARI: ${{ secrets.CALENDARI }}
          PRIVACY: ${{ vars.PRIVACY }}
