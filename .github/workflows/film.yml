# Film per la Bacheca (cinema e streaming): una volta a settimana, il lunedì verso le 7:30 (ora italiana; il cron è in UTC).
name: Film
on:
  schedule:
    - cron: "30 6 * * 1"
  workflow_dispatch: {}
concurrency: { group: film, cancel-in-progress: false }
jobs:
  aggiorna:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: scripts/requisiti.txt }
      - run: pip install -r scripts/requisiti.txt
      - run: python scripts/film.py
        env:
          FIREBASE_CHIAVE: ${{ secrets.FIREBASE_CHIAVE }}
          TMDB_CHIAVE: ${{ secrets.TMDB_CHIAVE }}
