# Le note di scuola (verifiche, interrogazioni…): le mette Claude, per esempio da uno screenshot di School Planner.
name: Note di scuola
on:
  workflow_dispatch:
    inputs:
      note:
        description: "JSON con persona e note (vedi scripts/compiti.py)"
        required: true
concurrency: { group: compiti, cancel-in-progress: false }
jobs:
  metti:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: scripts/requisiti.txt }
      - run: pip install -r scripts/requisiti.txt
      - run: python scripts/compiti.py
        env:
          FIREBASE_CHIAVE: ${{ secrets.FIREBASE_CHIAVE }}
