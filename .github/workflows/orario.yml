# L'orario di lavoro della settimana: lo avvia Claude con i turni letti dalla foto dell'orario scritto a mano.
name: Orario di lavoro
on:
  workflow_dispatch:
    inputs:
      turni:
        description: "JSON con persona, da, a e turni (vedi scripts/orario.py)"
        required: true
concurrency: { group: orario, cancel-in-progress: false }
jobs:
  metti:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: scripts/requisiti.txt }
      - run: pip install -r scripts/requisiti.txt
      - run: python scripts/orario.py
        env:
          FIREBASE_CHIAVE: ${{ secrets.FIREBASE_CHIAVE }}
